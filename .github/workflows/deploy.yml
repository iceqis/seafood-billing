name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check

  deploy-worker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Restore Feishu variables without code rollback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_SCRIPT_NAME: seafood-billing-api
          SOURCE_VERSION_PREFIX: b01f1b84
        run: node scripts/recover-feishu-vars.js
      - uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.125.0'
          command: deploy
      - name: Verify Worker health
        run: >-
          curl --fail-with-body --silent --show-error
          --retry 5 --retry-all-errors --retry-delay 5
          --connect-timeout 10 --max-time 30
          https://seafood-billing-api.iceqy0313.workers.dev/api/health
      - name: Verify auth challenge
        run: >-
          curl --fail-with-body --silent --show-error
          --retry 5 --retry-all-errors --retry-delay 5
          --connect-timeout 10 --max-time 30
          --header 'Origin: https://iceqis.github.io'
          https://seafood-billing-api.iceqy0313.workers.dev/api/auth/challenge
      - name: Verify protected endpoint
        env:
          EXPECTED_STATUS: '401'
        run: |
          status=''
          for attempt in 1 2 3 4 5; do
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --connect-timeout 10 --max-time 30 https://seafood-billing-api.iceqy0313.workers.dev/api/customers)" && test "$status" = "$EXPECTED_STATUS" && exit 0
            test "$attempt" = '5' || sleep 5
          done
          echo "Expected protected endpoint to return ${EXPECTED_STATUS}; received ${status}" >&2
          exit 1

  deploy-pages:
    needs: deploy-worker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
      - name: Verify deployed Pages site
        env:
          DEPLOYED_PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: >-
          curl --fail-with-body --silent --show-error
          --retry 5 --retry-all-errors --retry-delay 5
          --connect-timeout 10 --max-time 30
          "$DEPLOYED_PAGE_URL"
